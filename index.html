<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神话试炼 · Mythic Trials — Low-bit 桌游</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0f0f18; color:#e8e6f0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; touch-action:manipulation; }
  h1,h2,h3 { font-weight:600; }
  .gold { color:#e8c469; }
  button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 14px;
           background:#2c2c44; color:#e8e6f0; font-size:14px; transition:filter .15s; }
  button:hover:not(:disabled) { filter:brightness(1.25); }
  button:disabled { opacity:.38; cursor:not-allowed; }
  button.primary { background:#8a6a24; } button.primary:hover:not(:disabled){ filter:brightness(1.2); }
  button.danger { background:#7a3030; }
  img.pix { image-rendering:pixelated; }

  /* ---------- title screen ---------- */
  #screen-title { max-width:960px; margin:0 auto; padding:36px 20px 60px; text-align:center; }
  #screen-title h1 { font-size:34px; letter-spacing:6px; margin:8px 0 2px; }
  .subtitle { color:#9a9ab5; margin-bottom:26px; }
  .modes { display:flex; gap:14px; justify-content:center; margin:20px 0 8px; flex-wrap:wrap; }
  .mode-card { width:250px; background:#181826; border:1px solid #343452; border-radius:14px;
               padding:18px 16px; cursor:pointer; transition:.15s; text-align:left; }
  .mode-card:hover { border-color:#e8c469; transform:translateY(-3px); }
  .mode-card.sel { border-color:#e8c469; box-shadow:0 0 0 2px #e8c46955; background:#1e1c28; }
  .mode-card h3 { margin:0 0 8px; color:#e8c469; font-size:17px; }
  .mode-card p { margin:0; font-size:12.5px; color:#b9b7cc; line-height:1.6; }
  .heroes-pick { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .hero-card { width:180px; background:#181826; border:1px solid #343452; border-radius:14px;
               padding:12px; cursor:pointer; transition:.15s; }
  .hero-card:hover { border-color:#7f7fb0; transform:translateY(-3px); }
  .hero-card.sel { border-color:#e8c469; box-shadow:0 0 0 2px #e8c46955; }
  .hero-card.taken { opacity:.35; pointer-events:none; }
  .hero-card h4 { margin:8px 0 4px; font-size:15px; }
  .hero-card .stat { font-size:12px; color:#b9b7cc; line-height:1.55; text-align:left; }
  #start-btn { margin-top:24px; font-size:17px; padding:12px 42px; }
  #pick-tip { color:#9a9ab5; min-height:20px; margin-top:10px; font-size:14px; }

  /* ---------- game screen ---------- */
  #screen-game { display:none; max-width:1240px; margin:0 auto; padding:14px 16px 30px; }
  #topbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
            background:#181826; border:1px solid #343452; border-radius:12px; padding:10px 16px; }
  #topbar .tt { font-size:18px; letter-spacing:3px; color:#e8c469; }
  #topbar .pill { background:#242438; border-radius:20px; padding:4px 14px; font-size:13px; }
  #main { display:grid; grid-template-columns: 1fr 320px; gap:14px; margin-top:14px; }
  #map { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .tile { position:relative; aspect-ratio:1; border-radius:12px; border:1px solid #343452;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          cursor:default; user-select:none; overflow:hidden; padding:4px; text-align:center; }
  .tile .ticon { font-size:26px; line-height:1; }
  .tile .tname { font-size:11px; color:#c9c7dd; margin-top:3px; }
  .tile.forest{background:#15251a;} .tile.mount{background:#241f1c;} .tile.coast{background:#13222e;}
  .tile.spring{background:#142a33;} .tile.temple{background:#2a2416;} .tile.start{background:#26213a;}
  .tile.boss{background:#2e1518;} .tile.revealed{background:#221a2e;}
  .tile.adj { cursor:pointer; border-color:#e8c469; box-shadow:inset 0 0 0 2px #e8c46944; }
  .tile.adj:hover { filter:brightness(1.35); }
  .tile.here { border-color:#7fd4ff; box-shadow:0 0 10px #7fd4ff55; }
  .tile .occ { position:absolute; bottom:3px; right:3px; display:flex; gap:2px; }
  .tile .occ img { border-radius:6px; background:#00000088; border:1px solid #7fd4ff; }
  .tile .stack { position:absolute; top:3px; right:5px; font-size:10px; color:#8a88a5; }
  .tile .lock { position:absolute; inset:0; background:#000000aa; display:flex; align-items:center;
                justify-content:center; font-size:24px; }
  #side { display:flex; flex-direction:column; gap:12px; }
  .panel { background:#181826; border:1px solid #343452; border-radius:12px; padding:12px 14px; }
  .panel h3 { margin:0 0 8px; font-size:14px; color:#e8c469; letter-spacing:1px; }
  .hero-box { display:flex; gap:10px; padding:10px; border-radius:10px; background:#202032;
              margin-bottom:8px; border:1px solid transparent; }
  .hero-box.active { border-color:#e8c469; }
  .hero-box.down { filter:grayscale(.8); opacity:.7; }
  .hero-box .hb-name { font-size:14px; font-weight:600; }
  .hero-box .hb-sub { font-size:11.5px; color:#b9b7cc; margin-top:2px; }
  .bar { height:9px; border-radius:5px; background:#33334a; overflow:hidden; margin-top:5px; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#57b66b,#8fe08a); }
  .bar.enemy > i { background:linear-gradient(90deg,#b64444,#e0755a); }
  .res { display:inline-flex; align-items:center; gap:3px; margin-right:9px; font-size:12.5px; }
  .chp { font-size:12.5px; padding:5px 8px; border-radius:8px; margin-bottom:5px; background:#202032; }
  .chp.done { color:#8fe08a; } .chp.now { color:#ffd97a; border:1px dashed #8a6a24; }
  .chp.todo { color:#7d7b95; }
  #log { font-size:12.5px; line-height:1.65; max-height:170px; overflow-y:auto; color:#c9c7dd; }
  #log .sys { color:#8fe08a; } #log .bad { color:#ff9a8a; } #log .gold { color:#ffd97a; }
  #actions { display:flex; flex-wrap:wrap; gap:8px; }

  /* ---------- modal ---------- */
  #modal-wrap { position:fixed; inset:0; background:#000000c8; display:none;
                align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:#1a1a28; border:1px solid #4a4a6a; border-radius:16px; padding:22px;
           max-width:720px; width:100%; max-height:92vh; overflow-y:auto; }
  .fight { display:flex; align-items:center; justify-content:space-around; gap:10px; margin:10px 0; }
  .fighter { text-align:center; width:180px; }
  .fighter .fname { font-size:15px; font-weight:600; margin-top:4px; }
  .fighter .fstat { font-size:12px; color:#b9b7cc; }
  #dice { font-size:44px; width:84px; height:84px; line-height:84px; text-align:center;
          background:#242438; border:2px solid #e8c469; border-radius:16px; color:#ffd97a; }
  .cbt-btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .shop-item { background:#202032; border-radius:10px; padding:10px; text-align:center; }
  .shop-item .p { color:#ffd97a; font-size:13px; margin:4px 0 8px; }
  .shop-item .d { font-size:11.5px; color:#b9b7cc; min-height:32px; }
  .score-table { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px; }
  .score-table td { padding:5px 8px; border-bottom:1px solid #2c2c44; }
  .score-table td:last-child { text-align:right; color:#ffd97a; }
  .rules-box { text-align:left; font-size:13.5px; line-height:1.75; }
  .rules-box h3 { color:#e8c469; margin:14px 0 4px; font-size:15px; }
  .vs { font-size:22px; color:#8a88a5; }

  /* ================= 移动端适配 (≤820px, PC 端不受影响) ================= */
  @media (max-width: 820px) {
    #screen-title { padding: 18px 10px 40px; }
    #screen-title h1 { font-size: 24px; letter-spacing: 3px; }
    .subtitle { font-size: 12px; margin-bottom: 14px; }
    #hero-show img { width: 40px !important; height: 40px !important; }
    .modes { flex-direction: column; align-items: stretch; gap: 10px; margin: 12px 0 6px; }
    .mode-card { width: auto; }
    .heroes-pick { gap: 8px; }
    .hero-card { width: calc(50% - 4px); padding: 8px 6px; }
    .hero-card img { width: 64px !important; height: 64px !important; }
    .hero-card .stat { font-size: 11px; }
    #start-btn { width: 100%; margin-top: 14px; }
    #rules-btn { width: 100%; margin-top: 8px; }

    #screen-game { padding: 8px 8px calc(20px + env(safe-area-inset-bottom)); }
    #topbar { gap: 5px; padding: 8px 10px; }
    #topbar .tt { width: 100%; font-size: 14px; letter-spacing: 1px; }
    #topbar .pill { font-size: 11px; padding: 3px 9px; }
    #topbar button { padding: 6px 10px; font-size: 12px; }

    #main { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    #side { order: -1; }                       /* 英雄状态置顶, 热座方便查看 */
    #map { gap: 5px; }
    .tile { border-radius: 9px; padding: 2px; }
    .tile .ticon { font-size: 17px; }
    .tile .tname { font-size: 8.5px; line-height: 1.25; margin-top: 1px; }
    .tile > img.pix { width: 34px !important; height: 34px !important; }
    .tile .occ img { width: 20px !important; height: 20px !important; }
    .tile .stack { font-size: 9px; }

    #actions { gap: 6px; }
    #actions button { flex: 1 1 44%; padding: 11px 6px; font-size: 13px; }
    #log { max-height: 110px; font-size: 12px; }
    .panel { padding: 10px; }
    .hero-box { padding: 8px; gap: 8px; }
    .hero-box img { width: 48px !important; height: 48px !important; }
    .res img { width: 13px !important; height: 13px !important; }

    .modal { padding: 14px 12px; max-width: 94vw; border-radius: 12px; }
    .fight { flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    .fighter { width: calc(50% - 4px); }
    .fighter img.pix { width: 76px !important; height: 76px !important; }
    #dice { width: 58px; height: 58px; line-height: 58px; font-size: 28px; }
    .cbt-btns button { flex: 1 1 44%; padding: 11px 6px; font-size: 13px; }
    .shop-grid { grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); gap: 8px; }
    .shop-item img { width: 48px !important; height: 48px !important; }
    .rules-box { font-size: 12.5px; }
    .score-table { font-size: 12px; }
    #restore-modal { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- ================= 标题 / 设置 ================= -->
<div id="screen-title">
  <h1>神 话 试 炼</h1>
  <div class="subtitle">MYTHIC TRIALS · Low-bit 希腊神话桌游 · 1~2 人</div>
  <div id="hero-show" style="display:flex;justify-content:center;gap:6px;margin-bottom:6px"></div>
  <div class="modes" id="modes"></div>
  <div id="pick-tip">请选择游戏模式</div>
  <div class="heroes-pick" id="hero-pick"></div>
  <div>
    <button class="primary" id="start-btn" disabled>开始试炼</button>
    <button id="rules-btn">规则说明</button>
  </div>
</div>

<!-- ================= 游戏主界面 ================= -->
<div id="screen-game">
  <div id="topbar">
    <span class="tt">神话试炼</span>
    <span class="pill" id="tb-mode"></span>
    <span class="pill" id="tb-round"></span>
    <span class="pill" id="tb-turn"></span>
    <span class="pill" id="tb-ap"></span>
    <span style="flex:1"></span>
    <button id="btn-rules2" style="padding:5px 12px;font-size:12.5px">规则</button>
    <button id="btn-quit" class="danger" style="padding:5px 12px;font-size:12.5px">放弃本局</button>
  </div>
  <div id="main">
    <div>
      <div id="map"></div>
      <div class="panel" style="margin-top:12px">
        <h3>行动</h3>
        <div id="actions"></div>
      </div>
      <div class="panel" style="margin-top:12px">
        <h3>冒险日志</h3>
        <div id="log"></div>
      </div>
    </div>
    <div id="side">
      <div class="panel"><h3>英雄</h3><div id="heroes"></div></div>
      <div class="panel" id="chapters-panel"><h3 id="chapters-title">章节目标</h3><div id="chapters"></div></div>
    </div>
  </div>
</div>

<!-- ================= 弹窗 ================= -->
<button id="restore-modal" onclick="restoreModal()" style="display:none;position:fixed;right:18px;bottom:18px;z-index:60;background:#8a6a24;box-shadow:0 4px 16px #000c;padding:10px 18px">📜 恢复弹窗</button>
<div id="modal-wrap"><div class="modal" id="modal"></div></div>

/* ---------------- 1. sprite 解码 ---------------- */
const SPR = {};
for (const s of PACK.sprites) SPR[s.id] = s;
function spriteURL(id) {
  const s = SPR[id];
  if (!s) return "";
  if (!s._url) {
    const pal = s.palette.map(h => [0, 2, 4, 6].map(i => parseInt(h.substr(i, 2), 16)));
    const bytes = s.data.match(/../g).map(b => parseInt(b, 16));
    const cv = document.createElement("canvas");
    cv.width = s.w; cv.height = s.h;
    const ctx = cv.getContext("2d");
    const im = ctx.createImageData(s.w, s.h);
    let p = 0;
    for (let i = 0; i < bytes.length; i += 2) {
      const c = pal[bytes[i + 1]];
      for (let k = 0; k < bytes[i]; k++) {
        im.data[p++] = c[0]; im.data[p++] = c[1]; im.data[p++] = c[2]; im.data[p++] = c[3];
      }
    }
    ctx.putImageData(im, 0, 0);
    s._url = cv.toDataURL();
  }
  return s._url;
}
function simg(id, size) {
  size = size || 64;
  return `<img class="pix" src="${spriteURL(id)}" width="${size}" height="${size}" alt="${id}">`;
}

function grantMilestone(p, key, vp) {
  const m = G.milestones[key];

    log(`里程碑! ${p.name} 抢先达成「${NAMES[key]}」, +${vp} 分。`, "gold");

  $("hero-pick").innerHTML = Object.entries(HERODEF).map(([id, h]) => {
    const sel = setup.picked.includes(id), taken = setup.mode && setup.picked.includes(id);
    return `<div class="hero-card ${sel ? "sel" : ""}" onclick="pickHero('${id}')">
      <div style="text-align:center">${simg(id, 84)}</div>
      <h4 style="text-align:center">${h.name}</h4>
      <div class="stat">生命 ${h.pv} · 攻击修正 +${h.atk}<br>技能「${h.ab}」(${h.abCost})<br>${h.abDesc}</div>
    </div>`;
  }).join("");
  $("start-btn").disabled = !(setup.mode && setup.picked.length === MODES[setup.mode].need);
}
function pickHero(id) {
  if (!setup.mode) return;
  const i = setup.picked.indexOf(id);
  if (i >= 0) setup.picked.splice(i, 1);
  else if (setup.picked.length < MODES[setup.mode].need) setup.picked.push(id);
  renderHeroPick();
}

/* ---------------- 5. 开局 ---------------- */
let G = null;
function startGame() {
  closeModal();  // 重置弹窗锁 (连开新局时)
  const mode = setup.mode;
  const coopBonus = mode === "coop";
  G = {
    mode, round: 1, turn: 0, over: false,
    players: setup.picked.map((id, i) => ({
      hero: id, name: HERODEF[id].name, label: mode === "duel" ? `玩家${i + 1}` : HERODEF[id].name,
      pvMax: HERODEF[id].pv, pv: HERODEF[id].pv, or: mode === "duel" ? 4 : 3, es: 1, el: 1,
      artifacts: [], trophies: [], vpBonus: 0, x: 1, y: 1, down: false, freeMove: false, ms: {},
    })),
    tiles: [], logs: [], combat: null,
    chapters: CHAPTERS.map(() => false),
    kills: 0, milestones: { t2: { round: null }, art: { round: null }, t3: { round: null } },
    bossOpen: mode === "duel", bossDead: false, prevPos: null,
    bossLevel: 0, bossVP: 5, bossKills: 0, apBonus: 0, pendingApBonus: 0,
  };
  buildMap(coopBonus);
  $("screen-title").style.display = "none";
  $("screen-game").style.display = "block";
  $("tb-mode").textContent = MODES[mode].name;
  $("chapters-title").textContent = mode === "duel" ? "里程碑 (先抢先得)" : "章节目标";
  log(`试炼开始! ${G.players.map(p => p.name).join(" 与 ")} 踏入神话大地。`, "sys");
  if (mode !== "duel") log("完成章节目标, 讨伐冥界之门后的堤丰。第 6 轮起怒火侵蚀且逐轮加剧, 切勿拖延!", "gold");
  else log("8 轮竞速! 奖杯、神器与里程碑都将转化为分数。", "gold");
  turnBegin();
}
function buildMap(coopBonus) {
  // 全部 23 张遭遇牌都会铺入地图; 两名冥界守卫保证出现在较前段
  const guardC = mkMon("cerbere", coopBonus);
  const guardK = mkMon("charon", coopBonus);
  const deck = [];
  for (const id of Object.keys(MON)) {
    if (id === "typhon" || id === "cerbere" || id === "charon") continue;
    deck.push(mkMon(id, coopBonus));
  }
  deck.push({ kind: "biche" });
  for (const c of ["or", "or", "es", "es", "el", "el"]) deck.push({ kind: "cache", cache: c });
  shuffle(deck);
  for (const g of shuffle([guardC, guardK])) {
    deck.splice(Math.floor(Math.random() * 12), 0, g);
  }
  const generic = [];
  for (let y = 0; y < 4; y++) {
    const row = [];
    for (let x = 0; x < 4; x++) {
      const type = MAPDEF[y][x];
      const tile = { type, x, y, stack: [], top: null };
      if (["forest", "mount", "coast"].includes(type)) generic.push(tile);
      if (type === "boss") {
        tile.stack = [mkMon("typhon", coopBonus)];
      }
      row.push(tile);
    }
    G.tiles.push(row);
  }
  shuffle(generic);
  deck.forEach((card, i) => generic[i % generic.length].stack.push(card));
}

/* ---------------- 6. 回合流程 ---------------- */
function cur() { return G.players[G.turn]; }
function turnBegin() {
  if (G.over) return;
  const p = cur();
  G.ap = 3 + (G.apBonus || 0);
  p.freeMove = hasArt(p, "argo");
  if (p.down) {
    log(`${p.name} 倒地休养, 跳过本回合。`, "bad");
    nextTurn();
    return;
  }
  if (hasArt(p, "miroir") && p.pv < p.pvMax) { p.pv++; log(`${p.name} 的海洋之镜涌动, 生命 +1。`, "sys"); }
  renderAll();
}
function nextTurn() {
  endCombat();
  G.turn++;
  if (G.turn >= G.players.length) {
    G.turn = 0;
    endOfRound();
    if (G.over) return;
  }
  turnBegin();
}
function endOfRound() {
  if (G.mode === "duel") {
    if (G.round >= 8) { finishDuel(); return; }
    if (G.pendingApBonus) {
      G.apBonus = G.pendingApBonus; G.pendingApBonus = 0;
      log(`诸神赐福: 本轮起双方行动点 +1 (每回合 ${3 + G.apBonus} 点)。`, "gold");
    }
    G.round++;
    log(`—— 第 ${G.round} 轮开始 (共 8 轮) ——`, "gold");
  } else {
    G.round++;
    if (G.round >= 6) {
      const fire = G.round >= 10 ? 3 : G.round >= 8 ? 2 : 1;
      for (const p of G.players) if (!p.down) { p.pv -= fire; }
      log(`堤丰的怒火席卷大地! 所有英雄生命 -${fire}。`, "bad");
      checkDeaths();
      if (G.over) return;
    } else {
      log(`—— 第 ${G.round} 轮 ——`, "gold");
    }
  }
}
function endTurn() {
  if (G.over || MODAL_OPEN) return;
  log(`${cur().name} 结束了回合。`);
  nextTurn();
}
function restAction() {
  const p = cur();
  if (G.ap <= 0 || G.combat || MODAL_OPEN) return;
  const heal = hasHero(p, "heros2") ? 3 : 2;
  p.pv = Math.min(p.pvMax, p.pv + heal);
  log(`${p.name} 原地休整, 生命 +${heal}。`, "sys");
  endTurn();
}

/* ---------------- 7. 地图渲染与移动 ---------------- */
function tileAt(x, y) { return G.tiles[y][x]; }
function isAdj(x, y) { const p = cur(); return Math.abs(p.x - x) + Math.abs(p.y - y) === 1; }
function renderMap() {
  const p = cur();
  let html = "";
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const t = tileAt(x, y);
    const ter = TERRAIN[t.type];
    const cls = ["tile", t.type];
    const here = G.players.some(pl => !pl.down && pl.x === x && pl.y === y);
    if (here) cls.push("here");
    const canGo = !G.over && !G.combat && !p.down && isAdj(x, y) && (G.ap > 0 || p.freeMove);
    if (canGo) cls.push("adj");
    let inner = "";
    if (t.top && t.top.kind === "monster") {
      const m = MON[t.top.id];
      inner = `${simg(t.top.id, 54)}<div class="tname">${m.name}<br>HP ${t.top.hp} · 攻 ${m.atk}</div>`;
      cls.push("revealed");
    } else if (t.top && t.top.kind === "biche") {
      inner = `${simg("biche", 54)}<div class="tname">金色圣鹿 (友善)</div>`;
    } else {
      inner = `<div class="ticon">${ter.icon}</div><div class="tname">${ter.name}</div>`;
    }
    if (t.stack.length > 1) inner += `<div class="stack">×${t.stack.length}</div>`;
    if (t.type === "boss" && !G.bossOpen && !G.bossDead) inner += `<div class="lock">🔒</div>`;
    const occ = G.players.filter(pl => !pl.down && pl.x === x && pl.y === y)
      .map(pl => simg(pl.hero, 26)).join("");
    if (occ) inner += `<div class="occ">${occ}</div>`;
    html += `<div class="${cls.join(" ")}" onclick="tileClick(${x},${y})">${inner}</div>`;
  }
  $("map").innerHTML = html;
}
function tileClick(x, y) {
  if (G.over || G.combat || MODAL_OPEN) return;
  const p = cur();
  if (p.down || !isAdj(x, y)) return;
  if (G.ap <= 0 && !p.freeMove) { flash("行动点不足"); return; }
  const t = tileAt(x, y);
  if (t.type === "boss" && !G.bossOpen && !G.bossDead) {
    flash(G.mode === "duel" ? "冥界之门敞开着……" : "冥界之门被神力封锁——先完成第三章!");
    if (G.mode !== "duel") return;
  }
  if (p.freeMove) { p.freeMove = false; log(`${p.name} 乘阿尔戈号疾行, 未消耗行动点。`, "sys"); }
  else G.ap--;
  G.prevPos = { x: p.x, y: p.y };
  p.x = x; p.y = y;
  log(`${p.name} 移动到 ${TERRAIN[t.type].name}。`);
  enterTile(t);
  renderAll();
}
function enterTile(t) {
  const p = cur();
  const fresh = !t.top && t.stack.length > 0;
  if (fresh) t.top = t.stack[0];
  if (!t.top) return;
  if (t.top.kind === "monster") {
    const m = MON[t.top.id];
    log(fresh
      ? `${p.name} 遭遇了 ${m.name}! (HP ${t.top.hp} · 攻 ${t.top.atk})`
      : `${p.name} 挑战 ${m.name}! (HP ${t.top.hp} · 攻 ${t.top.atk})`, "bad");
    startCombat(t);
    return;
  }
  if (t.top.kind === "biche") { openBiche(t); return; }
  if (t.top.kind === "cache") {
    const c = CACHE_DEF[t.top.cache];
    for (const k of Object.keys(c.gain)) p[k] += c.gain[k];
    log(`${p.name} 发现了${c.name}: ${rwText(c.gain)}!`, "gold");
    t.stack.shift(); t.top = t.stack[0] || null;
    if (t.top) log(`此地似乎还潜伏着什么……`);
    checkChapters();
  }
}
/* 原地探索: 不移动、不耗 AP, 直接触发当前格的遭遇 */
function exploreAction() {
  const p = cur();
  if (G.over || G.combat || p.down || MODAL_OPEN) return;
  const t = tileAt(p.x, p.y);
  if (!t.top && !t.stack.length) return;
  log(`${p.name} 探索了${TERRAIN[t.type].name}……`);
  enterTile(t);
  renderAll();
}

/* ---------------- 8. 圣鹿事件 ---------------- */
function openBiche(t) {
  const p = cur();
  showModal(`
    <h2 class="gold">🦌 金色圣鹿</h2>
    <div style="display:flex;gap:16px;align-items:center">
      ${simg("biche", 110)}
      <p style="line-height:1.7">一头眼泛神光的圣鹿静静望着你——它是阿尔忒弥斯的圣物, 不可伤害。<br>它低头轻触你的手背, 送上祝福:</p>
    </div>
    <div class="cbt-btns">
      <button class="primary" onclick="bicheBless('pv')">治愈祝福: 生命 +2</button>
      <button class="primary" onclick="bicheBless('es')">野性祝福: 精魄 +2</button>
    </div>`);

}
function bicheBless(kind) {
  const p = cur(), t = G._bicheTile;
  G._bicheTile = null;
  if (kind === "pv") { p.pv = Math.min(p.pvMax, p.pv + 2); log(`圣鹿的祝福治愈了 ${p.name}, 生命 +2。`, "sys"); }
  else { p.es += 2; log(`圣鹿赐予 ${p.name} 野性精魄, 精魄 +2。`, "sys"); }
  t.stack.shift(); t.top = t.stack[0] || null;
  closeModal(); renderAll();
}

/* ---------------- 9. 战斗 ---------------- */
/* 结束战斗(任意方式): 结算并消耗本战斗中使用的火焰精魄增幅 */
function endCombat() {
  const c = G.combat;
  if (c && c.es > 0) {
    const p = cur();
    const used = Math.min(c.es, p.es);
    p.es -= used;
    if (used > 0) log(`${p.name} 的精魄增幅燃尽, 消耗 ${used} 火焰精魄。`);
  }
  G.combat = null;
}
function startCombat(t) {
  const p = cur();
  G.combat = {
    tile: t, card: t.top, es: 0, abilityUsed: false, pending: null,
    kumeUsed: hasArt(p, "kume"), ringReady: false, monsterFirst: true,
  };
  renderCombat();
}
function combatHero() {
  const p = cur(), c = G.combat;
  let bonus = HERODEF[p.hero].atk + (hasArt(p, "marteau") ? 1 : 0);
  return { p, bonus, m: MON[c.card.id] };
}
function renderCombat() {
  if (!G.combat) return;
  const { p, bonus, m } = combatHero();
  const c = G.combat;
  const canReroll = c.pending && (p.el > 0 || (p.hero === "heros3" && !c.abilityUsed));
  const abText = { heros1: "战吼 (+2伤害/1雷晶)", heros2: "风之环 (免疫反击)", heros3: "幸运 (免费重掷)", heros4: "收割 (被动)" }[p.hero];
  showModal(`
    <h2 style="text-align:center">⚔️ 战斗 · ${m.name}</h2>
    <div class="fight">
      <div class="fighter">
        ${simg(p.hero, 110)}
        <div class="fname">${p.name}</div>
        <div class="fstat">生命 ${p.pv}/${p.pvMax}</div>
        <div class="bar"><i style="width:${Math.max(0, p.pv / p.pvMax * 100)}%"></i></div>
      </div>
      <div>
        <div id="dice">${c.pending ? c.pending.roll : "?"}</div>
        <div style="text-align:center;font-size:12px;color:#b9b7cc;margin-top:4px">
          ${c.pending ? `伤害 ${c.pending.dmg}` : `d6 +${bonus}${c.es ? ` +${c.es * 2}精魄` : ""}`}
        </div>
      </div>
      <div class="fighter">
        ${simg(c.card.id, 110)}
        <div class="fname">${m.name}</div>
        <div class="fstat">HP ${c.card.hp} · 攻 ${c.card.atk} · 档位 ${m.boss ? "BOSS" : "T" + m.tier} · ${m.vp} 分</div>
        <div class="fstat" style="color:#c9a86a">技能「${m.skill.name}」${c.card.id === "typhon"
          ? `反击 ${Math.min(5, 2 + G.bossLevel)}/6 概率 +2 伤害${G.mode === "coop" ? "; 合作模式波及队友 1 点" : ""}`
          : m.skill.desc}</div>
        <div class="bar enemy"><i style="width:${Math.min(100, Math.max(0, c.card.hp / c.card.max * 100))}%"></i></div>
      </div>
    </div>
    <div style="text-align:center;font-size:12.5px;color:#b9b7cc">
      精魄增幅: ${c.es} (每点 +2 伤害) · 雷晶 ${p.el} · 精魄 ${p.es}
    </div>
    <div class="cbt-btns">
      ${c.pending
        ? `<button class="primary" onclick="cConfirm()">确认造成 ${c.pending.dmg} 伤害</button>
           <button onclick="cReroll()" ${canReroll ? "" : "disabled"}>重掷 (1雷晶${p.hero === "heros3" && !c.abilityUsed ? "/幸运" : ""})</button>`
        : `<button class="primary" onclick="cRoll()">掷骰攻击</button>
           <button onclick="cES()" ${p.es > c.es && c.es < 3 ? "" : "disabled"}>+精魄增幅</button>
           <button onclick="cAbility()" ${c.abilityUsed || (p.hero === "heros1" && p.el < 1) || p.hero === "heros4" ? "disabled" : ""}>技能: ${abText}</button>
           <button class="danger" onclick="cRetreat()" ${m.boss || (m.sub && !c.attackCount) ? "disabled" : ""}>${m.boss ? "不可撤退" : m.sub && !c.attackCount ? "暂不可撤退" : "撤退"}</button>`}
    </div>
    <div style="text-align:center;font-size:12px;color:#7d7b95;margin-top:8px">${m.desc} · 击杀奖励: ${rwText(m.rw)}${m.boss ? " · <b style='color:#ff9a8a'>BOSS 战不可撤退</b>" : m.sub ? " · <b style='color:#ffd97a'>副BOSS: 发起首次攻击前不可撤退</b>" : ""}</div>`);
}
function cES() { const c = G.combat; c.es++; renderCombat(); }
function cRoll() {
  const { bonus } = combatHero();
  const c = G.combat;
  const roll = d6();
  let dmg = roll + bonus + c.es * 2 + (c.warcry || 0);
  if (c.debuffNext) {
    dmg = Math.max(0, dmg - c.debuffNext);
    log(`诅咒缠身, 本次攻击 -${c.debuffNext} 伤害。`, "bad");
    c.debuffNext = 0;
  }
  c.pending = { roll, dmg };
  c.warcry = 0;
  animateDice(roll);
  setTimeout(renderCombat, 350);
}
function cReroll() {
  const p = cur(), c = G.combat;
  if (!c.pending) return;
  if (p.hero === "heros3" && !c.abilityUsed) { c.abilityUsed = true; log(`${p.name} 发动「幸运」, 免费重掷!`, "sys"); }
  else if (p.el > 0) { p.el--; log(`${p.name} 消耗 1 雷晶重掷骰子。`); }
  else return;
  const { bonus } = combatHero();
  const roll = d6();
  c.pending = { roll, dmg: roll + bonus + c.es * 2 };
  animateDice(roll);
  setTimeout(renderCombat, 350);
}
function cAbility() {
  const p = cur(), c = G.combat;
  if (c.abilityUsed) return;
  if (p.hero === "heros1" && p.el >= 1) {
    p.el--; c.warcry = 2; c.abilityUsed = true;
    log(`${p.name} 发动「战吼」, 下次攻击 +2 伤害!`, "sys");
  } else if (p.hero === "heros2") {
    c.ringReady = true; c.abilityUsed = true;
    log(`${p.name} 展开「风之环」, 将免疫下一次反击!`, "sys");
  }
  renderCombat();
}
function cConfirm() {
  const { p, m } = combatHero();
  const c = G.combat;
  const id = c.card.id;
  let dmg = c.pending.dmg;
  c.pending = null;
  c.attackCount = (c.attackCount || 0) + 1;
  /* ---- 怪物受击技能 ---- */
  if ((id === "satyre" && chance6(2)) || (id === "syline" && chance6(2))) {
    log(`${m.name} 的「${m.skill.name}」发动, 身形一闪躲过了攻击!`, "gold");
    dmg = 0;
  } else {
    if (id === "crabe" && dmg > 1) { dmg = Math.max(1, dmg - 1); log(`${m.name}的「水晶甲壳」弹开部分力道, 伤害 -1。`, "gold"); }
    if (id === "argos" && chance6(2)) { dmg = Math.ceil(dmg / 2); log(`${m.name}「全视看破」了你的招式, 伤害减半!`, "gold"); }
    if (id === "ours" && chance6(2)) { dmg = Math.max(0, dmg - 2); log(`${m.name}星云流转, 「星云护体」使伤害 -2。`, "gold"); }
    if (id === "sphinx" && c.attackCount === 1) { dmg = Math.ceil(dmg / 2); log(`${m.name}的「谜语束缚」困住了你, 首次攻击伤害减半!`, "gold"); }
  }
  c.card.hp -= dmg;
  log(dmg > 0 ? `${p.name} 对 ${m.name} 造成 ${dmg} 点伤害!` : `${p.name} 的攻击落空了!`);
  if (c.card.hp <= 0) { killMonster(); return; }
  if (id === "hydre" && chance6(2)) {
    c.card.hp = Math.min(c.card.max, c.card.hp + 1);
    log(`${m.name}的「再生」涌出新头颅, HP +1!`, "gold");
  }
  monsterCounter();
  if (!G.over && G.combat) renderCombat();
}
function monsterCounter() {
  const { p, m } = combatHero();
  const c = G.combat;
  const id = c.card.id;
  /* ---- 免疫类能力 (暗影神盔/风之环): 对 BOSS 失效, 对副 BOSS 减半(向下取整), 其余全额 ---- */
  const imm = MON[id].boss ? 0 : MON[id].sub ? 2 : 1;
  const atkV = c.card.atk != null ? c.card.atk : m.atk;   // 支持复活强化后的动态攻击力
  let negate = 0;
  if (c.monsterFirst && c.kumeUsed) {
    c.kumeUsed = false;
    if (imm === 0) log(`暗影神盔在 ${m.name} 的伟力面前黯然失效!`, "bad");
    else negate = imm === 2 ? Math.floor(atkV / 2) : atkV;
  }
  c.monsterFirst = false;
  if (c.ringReady) {
    c.ringReady = false;
    if (imm === 0) log(`风之环被 ${m.name} 的伟力撕碎!`, "bad");
    else negate = Math.max(negate, imm === 2 ? Math.floor(atkV / 2) : atkV);
  }
  let dmg = Math.max(0, atkV - (hasArt(p, "egide") ? 1 : 0));
  c.counterCount = (c.counterCount || 0) + 1;
  /* ---- 怪物反击技能 ---- */
  if (id === "sanglier" && c.counterCount === 1) { dmg += 2; log(`${m.name}「冲锋」势头凶猛, 首次反击 +2 伤害!`, "gold"); }
  if (id === "medanes" && chance6(2)) { dmg += 1; log(`${m.name}喷出「火花」, 反击 +1。`, "gold"); }
  if (id === "chouette" && chance6(2)) { dmg += 1; log(`${m.name}「夜视」精准啄击, 反击 +1。`, "gold"); }
  if (id === "cyclope" && chance6(2)) { dmg += 2; log(`${m.name}「蛮力」横扫, 反击 +2!`, "gold"); }
  if (id === "minotaure" && chance6(2)) { dmg *= 2; log(`${m.name}「巨斧横扫」, 反击伤害翻倍!`, "gold"); }
  if (id === "cerbere" && chance6(2)) { dmg += 3; log(`${m.name}「三首齐袭」, 追加撕咬 +3!`, "gold"); }
  if (id === "charon" && chance6(2)) {
    dmg += 2; c.card.hp = Math.min(c.card.max, c.card.hp + 1);
    log(`${m.name}的「亡魂漩涡」撕扯灵魂, 反击 +2 且自身 HP +1。`, "gold");
  }
  if (id === "triton" && chance6(2)) {
    dmg += 1; c.debuffNext = (c.debuffNext || 0) + 1;
    log(`${m.name}的「海潮阻滞」让你脚步沉重, 反击 +1, 下次攻击 -1。`, "gold");
  }
  if (id === "gorgone" && chance6(2)) {
    c.debuffNext = (c.debuffNext || 0) + 2;
    log(`${m.name}的「石化凝视」令你手臂僵硬, 下次攻击 -2!`, "gold");
  }
  if (id === "typhon") {
    if (chance6(c.card.chanceN || 2)) { dmg += 2; log(`${m.name}召来「风暴雷霆」, 反击 +2!`, "gold"); }
    if (G.mode === "coop") {
      const other = G.players.find(q => q !== p && !q.down);
      if (other) { other.pv -= 1; log(`风暴波及 ${other.name}, 生命 -1。`, "bad"); }
    }
  }
  const taken = Math.max(0, dmg - negate);
  if (negate > 0) log(`免疫类能力抵消了 ${negate} 点伤害。`, "sys");
  p.pv -= taken;
  log(`${m.name} 反击, ${p.name} 受到 ${taken} 点伤害。`, taken > 0 ? "bad" : "");
  checkDeaths();
}
function killMonster() {
  const { p, m } = combatHero();
  const c = G.combat, t = c.tile;
  /* ---- 竞争模式: 击杀堤丰 → 计分 → 弹回 → 堤丰复活强化 → 强制结束回合 ---- */
  if (m.boss && G.mode === "duel") {
    p.vpBonus += G.bossVP;
    G.bossKills++;
    if (G.bossKills === 1) {
      G.pendingApBonus = 1;
      log(`堤丰初次陨落, 诸神震动——从下一轮起, 双方行动点 +1 (变为 4)!`, "gold");
    }
    log(`${p.name} 讨伐堤丰, +${G.bossVP} 分! 风暴暂时平息……`, "gold");
    if (G.prevPos) { p.x = G.prevPos.x; p.y = G.prevPos.y; }
    log(`${p.name} 被风暴余波掀回${TERRAIN[tileAt(p.x, p.y).type].name}(不触发该格遭遇)。`, "bad");
    const lv = G.bossLevel + 1;
    G.bossLevel = lv;
    G.bossVP += 2;
    const hp = 16 + 3 * lv, atk = 5 + lv, cn = Math.min(5, 2 + lv);
    t.stack = [{ kind: "monster", id: "typhon", hp, max: hp, atk, chanceN: cn }];
    t.top = t.stack[0];
    log(`但堤丰卷土重来! HP ${hp} · 攻 ${atk} · 雷霆 ${cn}/6。下次讨伐 +${G.bossVP} 分。`, "bad");
    endCombat();
    closeModal();
    log(`${p.name} 的回合被强制结束。`);
    renderAll();
    nextTurn();
    return;
  }
  log(`${p.name} 击败了 ${m.name}! 获得 ${m.vp} 分与奖励: ${rwText(m.rw)}。`, "sys");
  p.trophies.push(c.card.id);
  G.kills++;
  for (const k of Object.keys(m.rw)) p[k] += m.rw[k];
  if (p.hero === "heros4") { p.or += 1; log(`「收割」发动, 额外 +1 黄金。`, "gold"); }
  t.stack.shift(); t.top = t.stack[0] || null;
  if (m.boss) { G.bossDead = true; }
  if (t.top) log(`${m.name} 倒下后, 新的阴影浮现……`, "bad");
  endCombat();
  closeModal();
  if (G.mode === "duel") {
    if (m.tier === 2) grantMilestone(p, "t2", 1);
    if (m.tier === 3) grantMilestone(p, "t3", 2);
  } else {
    checkChapters();
    if (m.boss) { finishStory(true); return; }
  }
  renderAll();
}
function cRetreat() {
  const p = cur(), c = G.combat;
  const m = MON[c.card.id];
  if (m.boss) { log("堤丰的风暴封锁了所有退路, BOSS 战不可撤退!", "bad"); renderCombat(); return; }
  if (m.sub && !c.attackCount) { log(`${m.name} 死死拦住去路——对副BOSS发起首次攻击后才能撤退!`, "bad"); renderCombat(); return; }
  if (G.prevPos) { p.x = G.prevPos.x; p.y = G.prevPos.y; }
  log(`${p.name} 且战且退, 撤回了${TERRAIN[tileAt(p.x, p.y).type].name}。(怪物伤势保留)`, "bad");
  endCombat();
  closeModal();
  renderAll();
}

/* ---------------- 10. 死亡 / 复活 ---------------- */
function checkDeaths() {
  let duelRespawnedCur = false;   // 竞争模式: 当前行动者被击倒并送回营地
  for (const p of G.players) {
    if (p.pv <= 0 && !p.down) {
      if (G.mode === "duel") {
        p.pv = 6; p.x = 1; p.y = 1; p.vpBonus -= 2;
        log(`${p.name} 重伤倒地, 被送回英雄营地 (生命 6, -2 分)。`, "bad");
        if (p === cur()) duelRespawnedCur = true;
        if (G.combat) { endCombat(); closeModal(); }
      } else if (G.mode === "solo") {
        p.down = true;
        finishStory(false);
        return;
      } else {
        p.down = true; p.pv = 0;
        log(`${p.name} 倒下了! 队友可前往同一格复活 (1 行动点 + 2 黄金)。`, "bad");
        if (G.players.every(q => q.down)) { finishStory(false); return; }
      }
    }
  }
  if (G.combat && cur().down) { endCombat(); closeModal(); }
  /* 当前行动英雄在自己回合内倒地(合作)或被击回营地(竞争) → 强制结束回合 */
  if (!G.over && cur().down) {
    log(`${cur().name} 无法继续行动, 回合自动结束。`, "bad");
    nextTurn();
    return;
  }
  if (!G.over && duelRespawnedCur) {
    log(`${cur().name} 的回合被强制结束。`, "bad");
    nextTurn();
    return;
  }
  renderAll();
}
function reviveAction() {
  const p = cur();
  if (MODAL_OPEN) return;
  const mate = G.players.find(q => q !== p && q.down && q.x === p.x && q.y === p.y);
  if (!mate || G.ap <= 0 || p.or < 2) return;
  G.ap--; p.or -= 2;
  mate.down = false; mate.pv = 5;
  log(`${p.name} 以 2 黄金举行复苏仪式, ${mate.name} 重新站起 (生命 5)!`, "sys");
  renderAll();
}

/* ---------------- 11. 章节 / 神器 / 商店 / 圣泉 ---------------- */
function checkChapters() {
  if (G.mode === "duel") return;
  const totalArt = G.players.reduce((n, p) => n + p.artifacts.filter(a => a !== "coffre").length, 0);
  const guardDead = G.players.some(p => p.trophies.includes("cerbere") || p.trophies.includes("charon"));
  const checks = [G.kills >= 2, totalArt >= 1, guardDead, G.bossDead];
  for (let i = 0; i < 4; i++) {
    if (G.chapters[i]) continue;
    if (!checks[i]) break;                       // 章节必须按顺序完成
    G.chapters[i] = true;
    if (i < 3) {
      for (const p of G.players) p.vpBonus += G.mode === "coop" ? 1 : 2;
      log(`章节完成: ${CHAPTERS[i].name}! ${G.mode === "coop" ? "每位英雄" : ""} +${G.mode === "coop" ? 1 : 2} 分。`, "gold");
    }
    if (i === 2 && !G.bossOpen) { G.bossOpen = true; log(`冥界之门的封印解除了! 堤丰在东南角等待挑战者……`, "gold"); }
  }
  renderAll();
}
function hasArt(p, id) { return p.artifacts.includes(id); }
function hasHero(p, id) { return p.hero === id; }
function openShop(force) {
  if (!force && MODAL_OPEN) return;   // 仅拦截玩家手动打开; 内部刷新走 force
  const p = cur();
  const banner = G.lastCoffreMsg
    ? `<div style="background:#2a2416;border:1px solid #8a6a24;border-radius:8px;padding:8px 12px;margin-bottom:10px;color:#ffd97a;font-size:13px">🎁 ${G.lastCoffreMsg}</div>` : "";
  const note = G.mode === "duel"
    ? `<div style="font-size:12px;color:#8a88a5;margin-top:6px">※ 潘多拉魔盒为一次性消耗品, 购买不计入「首件神器」里程碑</div>` : "";
  const items = Object.entries(ART).map(([id, a]) => {
    const owned = hasArt(p, id) && id !== "coffre";
    return `<div class="shop-item">
      ${simg(id, 64)}
      <div style="font-size:13.5px;font-weight:600">${a.name}</div>
      <div class="d">${a.desc}</div>
      <div class="p">${a.price} 黄金</div>
      <button class="primary" onclick="buyArt('${id}')" ${owned || p.or < a.price ? "disabled" : ""}>${owned ? "已拥有" : "购买"}</button>
    </div>`;
  }).join("");
  showModal(`<h2 class="gold">🏛️ 奥林匹斯神庙</h2>
    ${banner}
    <p style="color:#b9b7cc;font-size:13px">诸神的造物在此流通。当前黄金: <b class="gold">${p.or}</b>${note}</p>
    <div class="shop-grid">${items}</div>
    <div class="cbt-btns"><button onclick="closeModal()">离开</button></div>`);
}
function buyArt(id) {
  const p = cur(), a = ART[id];
  if (p.or < a.price) return;
  p.or -= a.price;
  if (id === "coffre") {
    const roll = d6();
    if (roll === 1) {
      p.pv -= 3; G.lastCoffreMsg = `潘多拉魔盒(掷出 ${roll}): 灾祸涌出, 受到 3 点伤害!`;
      log(`${p.name} 打开潘多拉魔盒, 灾祸涌出! 受到 3 点伤害。(掷出 ${roll})`, "bad");
      checkDeaths();
    } else if (roll <= 3) {
      G.lastCoffreMsg = `潘多拉魔盒(掷出 ${roll}): 盒中空空如也……`;
      log(`${p.name} 打开潘多拉魔盒, 盒中空空如也……(掷出 ${roll})`);
    } else if (roll <= 5) {
      p.or += 5; G.lastCoffreMsg = `潘多拉魔盒(掷出 ${roll}): 满盒财宝! +5 黄金`;
      log(`${p.name} 打开潘多拉魔盒, 满盒财宝! +5 黄金。(掷出 ${roll})`, "gold");
    } else {
      p.or += 6; p.es += 2; p.pv = Math.min(p.pvMax, p.pv + 2);
      G.lastCoffreMsg = `潘多拉魔盒(掷出 6): 盒底留下了「希望」! +6 黄金 +2 精魄 +2 生命`;
      log(`${p.name} 打开潘多拉魔盒——盒底留下了「希望」! +6 黄金 +2 精魄 +2 生命。(掷出 6)`, "gold");
    }
    if (G.mode === "duel") log(`※ 潘多拉魔盒为消耗品, 不计入「首件神器」里程碑。`);
    /* 若买家被自伤击倒, 回合已自动移交, 不能再把商店弹窗挂到下一位玩家头上 */
    if (!G.over && !p.down) { renderAll(); openShop(true); }
    else if (!G.over) renderAll();
    return;
  } else {
    p.artifacts.push(id);
    log(`${p.name} 购得神器「${a.name}」!`, "gold");
    if (G.mode === "duel") grantMilestone(p, "art", 1);
    checkChapters();
  }
  renderAll(); openShop(true);
}
function drinkSpring() {
  const p = cur();
  if (G.ap <= 0 || MODAL_OPEN) return;
  G.ap--;
  p.pv = Math.min(p.pvMax, p.pv + 3);
  log(`${p.name} 饮用圣泉, 生命 +3。`, "sys");
  renderAll();
}
/* 精魄换行动: 无行动点时, 消耗 2 火焰精魄换取 1 临时行动点 (每回合不限次数) */
function esToAp() {
  const p = cur();
  if (G.over || G.combat || p.down || MODAL_OPEN) return;
  if (G.ap !== 0 || p.es < 2) return;
  p.es -= 2;
  G.ap += 1;
  log(`${p.name} 燃烧 2 火焰精魄, 换取 1 行动点。`, "sys");
  renderAll();
}

/* ---------------- 12. 结算 ---------------- */
function trophyVP(p) { return p.trophies.reduce((n, id) => n + MON[id].vp, 0); }
function finishStory(win) {
  G.over = true;
  const rows = [];
  let total = 0;
  for (const p of G.players) {
    const tv = trophyVP(p);
    const chp = p.vpBonus;
    const pv = Math.max(0, p.pv);
    const gold = Math.floor(p.or / 3);
    total += tv + chp + pv + gold;
    rows.push(`<tr><td>${p.name}</td><td></td></tr>
      <tr><td>· 怪物奖杯 (${p.trophies.length} 只)</td><td>${tv}</td></tr>
      <tr><td>· 章节/里程碑得分</td><td>${chp}</td></tr>
      <tr><td>· 剩余生命</td><td>${pv}</td></tr>
      <tr><td>· 黄金折算 (${p.or} 枚)</td><td>${gold}</td></tr>`);
  }
  const speed = Math.max(0, 12 - G.round);
  total += speed;
  rows.push(`<tr><td>· 速度奖励 (第 ${G.round} 轮)</td><td>${speed}</td></tr>`);
  showModal(`
    <h2 style="text-align:center">${win ? "🏆 试炼成功!" : "💀 试炼失败……"}</h2>
    <p style="text-align:center;color:#b9b7cc">${win ? "堤丰的风暴平息了, 英雄的名字传遍希腊。" : "神话大地吞没了英雄的脚步。"}</p>
    <table class="score-table">${rows.join("")}</table>
    <h2 style="text-align:center" class="gold">总分 ${total}</h2>
    <div class="cbt-btns"><button class="primary" onclick="location.reload()">再来一局</button></div>`, true);
  renderAll();
}
function finishDuel() {
  G.over = true;
  const scored = G.players.map(p => {
    const tv = trophyVP(p);
    const art = p.artifacts.length * 2;
    const gold = Math.floor(p.or / 3);
    const res = Math.floor((p.es + p.el) / 2);
    const total = tv + art + p.vpBonus + gold + res;
    return { p, tv, art, ms: p.vpBonus, gold, res, total };
  });
  scored.sort((a, b) => b.total - a.total || b.tv - a.tv);
  const win = scored[0], tie = scored.length > 1 && scored[0].total === scored[1].total && scored[0].tv === scored[1].tv;
  const tables = scored.map(s => `
    <h3>${s.p.label} · ${s.p.name}</h3>
    <table class="score-table">
      <tr><td>怪物奖杯 (${s.p.trophies.map(t => MON[t].name).join("、") || "无"})</td><td>${s.tv}</td></tr>
      <tr><td>神器 (${s.p.artifacts.length} 件 × 2)</td><td>${s.art}</td></tr>
      <tr><td>里程碑与奖惩</td><td>${s.ms}</td></tr>
      <tr><td>黄金折算 (${s.p.or} 枚 ÷3)</td><td>${s.gold}</td></tr>
      <tr><td>资源折算 (精魄+雷晶 ${s.p.es + s.p.el} ÷2)</td><td>${s.res}</td></tr>
      <tr><td><b>总分</b></td><td><b>${s.total}</b></td></tr>
    </table>`).join("");
  showModal(`
    <h2 style="text-align:center">${tie ? "🤝 平分秋色!" : `🏆 ${win.p.label} 获胜!`}</h2>
    ${tables}
    <div class="cbt-btns"><button class="primary" onclick="location.reload()">再来一局</button></div>`, true);
  renderAll();
}

/* ---------------- 13. 渲染面板 / 行动 ---------------- */
function renderHeroes() {
  $("heroes").innerHTML = G.players.map((p, i) => `
    <div class="hero-box ${i === G.turn && !G.over ? "active" : ""} ${p.down ? "down" : ""}">
      <div>${simg(p.hero, 64)}</div>
      <div style="flex:1">
        <div class="hb-name">${G.mode === "duel" ? p.label + " · " : ""}${p.name}${p.down ? " (倒地)" : ""}</div>
        <div class="bar"><i style="width:${Math.max(0, p.pv / p.pvMax * 100)}%"></i></div>
        <div class="hb-sub">生命 ${Math.max(0, p.pv)}/${p.pvMax}</div>
        <div class="hb-sub">
          <span class="res">${simg("icon_or", 16)} ${p.or}</span>
          <span class="res">${simg("icon_es", 16)} ${p.es}</span>
          <span class="res">${simg("icon_el", 16)} ${p.el}</span>
          <span class="res">${simg("icon_pv", 16)} ${trophyVP(p) + p.vpBonus}分</span>
        </div>
        <div class="hb-sub">神器: ${p.artifacts.length ? p.artifacts.map(a => ART[a].name).join("、") : "无"}</div>
        <div class="hb-sub">奖杯: ${p.trophies.length ? p.trophies.map(t => MON[t].name).join("、") : "无"}</div>
      </div>
    </div>`).join("");
}
function renderChapters() {
  if (G.mode === "duel") {
    const ms = G.milestones;
    $("chapters").innerHTML = [
      ["首杀 T2 怪物 (+1, 同轮可追平)", ms.t2.round !== null],
      ["首件神器 (+1, 同轮可追平)", ms.art.round !== null],
      ["首杀 T3 怪物 (+2, 同轮可追平)", ms.t3.round !== null],
      [`击杀堤丰 (现 +${G.bossVP} 分, 每次复活更强)`, G.bossKills > 0],
      ["终局: 神器 ×2 / 黄金 ÷3 / 资源 ÷2", null],
    ].map(([t, done]) => `<div class="chp ${done === null ? "todo" : done ? "done" : "now"}">${done ? "✓ " : ""}${t}</div>`).join("");
  } else {
    $("chapters").innerHTML = CHAPTERS.map((c, i) => {
      const done = G.chapters[i];
      const now = !done && (i === 0 || G.chapters[i - 1]);
      return `<div class="chp ${done ? "done" : now ? "now" : "todo"}">${done ? "✓ " : ""}${c.name}<br><small>${c.desc}</small></div>`;
    }).join("");
  }
}
function renderActions() {
  const p = cur();
  const t = tileAt(p.x, p.y);
  const btns = [];
  if (!G.over && !p.down) {
    if (G.combat) {
      btns.push(`<button class="primary" disabled>战斗中……</button>`);
    } else {
      if (t.top || t.stack.length) {
        const label = t.top && t.top.kind === "monster" ? `挑战 ${MON[t.top.id].name} (免费)`
          : t.top && t.top.kind === "biche" ? `接触圣鹿 (免费)`
          : `探索此地 (免费)`;
        btns.push(`<button class="primary" onclick="exploreAction()">${label}</button>`);
      }
      if (t.type === "temple") btns.push(`<button class="primary" onclick="openShop()">进入神庙 (购物)</button>`);
      if (t.type === "spring") btns.push(`<button class="primary" onclick="drinkSpring()" ${G.ap <= 0 ? "disabled" : ""}>饮用圣泉 (+3生命 / 1AP)</button>`);
      const mate = G.players.find(q => q !== p && q.down && q.x === p.x && q.y === p.y);
      if (mate) btns.push(`<button class="primary" onclick="reviveAction()" ${G.ap <= 0 || p.or < 2 ? "disabled" : ""}>复活 ${mate.name} (1AP + 2黄金)</button>`);
      if (G.ap === 0 && p.es >= 2) btns.push(`<button class="primary" onclick="esToAp()">精魄换行动 (2精魄→1AP)</button>`);
      btns.push(`<button onclick="restAction()" ${G.ap <= 0 ? "disabled" : ""}>休息 (+${p.hero === "heros2" ? 3 : 2}生命, 结束回合)</button>`);
      btns.push(`<button class="primary" onclick="endTurn()">结束回合</button>`);
    }
  }
  $("actions").innerHTML = btns.join("");
  const apTxt = G.combat ? "战斗中" : `行动点 ${G.ap}/${3 + (G.apBonus || 0)}${p.freeMove ? " · 阿尔戈号待航" : ""}`;
  $("tb-ap").textContent = apTxt;
  $("tb-round").textContent = G.mode === "duel" ? `第 ${G.round}/8 轮` : `第 ${G.round} 轮`;
  $("tb-turn").textContent = `当前: ${G.mode === "duel" ? p.label + " · " : ""}${p.name}${p.down ? " (倒地跳过)" : ""}`;
}
function renderAll() {
  if (!G) return;
  renderMap(); renderHeroes(); renderChapters(); renderActions();
}

/* ---------------- 14. 弹窗 / 杂项 ---------------- */
let MODAL_OPEN = false;
function showModal(html, lock) {
  MODAL_OPEN = true;
  const hideBtn = `<div style="text-align:right;margin:-8px -8px 6px">
    <button onclick="hideModal()" style="padding:4px 12px;font-size:12px;background:#33334d">收起 ▾ 查看地图</button></div>`;
  $("modal").innerHTML = hideBtn + html;
  $("modal-wrap").style.display = "flex";
  $("restore-modal").style.display = "none";
  $("modal-wrap").onclick = lock ? null : e => { if (e.target === $("modal-wrap")) closeModal(); };
}
function hideModal() {
  $("modal-wrap").style.display = "none";       /* 弹窗仍在, 仅隐藏 */
  $("restore-modal").style.display = "block";   /* MODAL_OPEN 保持 true, 底部操作仍被锁定 */
}
function restoreModal() {
  $("modal-wrap").style.display = "flex";
  $("restore-modal").style.display = "none";
}
function closeModal() {
  MODAL_OPEN = false;
  $("modal-wrap").style.display = "none";
  $("restore-modal").style.display = "none";
}
function flash(msg) { log(msg, "bad"); }
let diceTimer = null;
function animateDice(final) {
  const el = $("dice");
  if (!el) return;
  let n = 0;
  clearInterval(diceTimer);
  diceTimer = setInterval(() => {
    el.textContent = 1 + Math.floor(Math.random() * 6);
    if (++n > 6) { clearInterval(diceTimer); el.textContent = final; }
  }, 45);
}

    第 6 轮起堤丰的怒火每轮侵蚀全员且逐渐加剧 (第6-7轮-1, 第8-9轮-2, 第10轮起-3)。
